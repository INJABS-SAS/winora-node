name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Las pruebas usan --experimental-strip-types (Node 22.6 o más).
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist

  # El paquete promete Node 18 o más: el build se carga en cada versión, con
  # require (CommonJS) y con import (ESM).
  carga:
    name: Carga en Node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: require y import
        run: |
          node -e "const { Winora, webhooks } = require('./dist/index.cjs'); new Winora('wk_test_AbCdEfGhIjKlMnOp1234'); if (typeof webhooks.constructEvent !== 'function') process.exit(1);"
          node --input-type=module -e "import { Winora, webhooks } from './dist/index.js'; new Winora('wk_test_AbCdEfGhIjKlMnOp1234'); if (typeof webhooks.constructEvent !== 'function') process.exit(1);"
